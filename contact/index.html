<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact | Tiffiny</title>
  <link rel="stylesheet" href="../assets/css/styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <h1 class="brand">Tiffiny</h1>
      <nav class="site-nav" aria-label="Main navigation">
        <a href="../home/index.html">Home</a>
        <a href="../about/index.html">About</a>
        <a href="../speak/index.html">Speak</a>
        <a href="../contact/index.html">Contact</a>
      </nav>
    </div>
  </header>

  <main class="main-content">
    <div class="container">
      <section class="hero">
        <h2>Contact</h2>
        <p class="muted">Use this form for a quick message demo.</p>
      </section>

      <section class="card" aria-label="Contact form">
        <form id="contact-form" novalidate>
          <div class="form-row">
            <label for="name">Name</label>
            <input id="name" name="name" type="text" required />
          </div>
          <div class="form-row">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" required />
          </div>
          <div class="form-row">
            <label for="message">Message</label>
            <textarea id="message" name="message" required></textarea>
          </div>
          <button class="btn" type="submit">Send Message</button>
          <p id="form-status" class="muted" role="status" aria-live="polite"></p>
        </form>
      </section>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">&copy; <span id="year"></span> Tiffiny</div>
  </footer>

  <script src="../assets/js/main.js"></script>
</body>
</html>
